
name: Python Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Project Code/requirements.txt"

      - name: Run all unit tests
        env:
          PYTHONPATH: "Project Code:Project Code/AI"
        run: python -m unittest discover -s "Test Script" -p "test_*.py" -v
